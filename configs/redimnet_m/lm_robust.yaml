# ReDimNet-M - ROBUST large-margin fine-tuning (variant B): configs/redimnet_m/lm.yaml with the same two
# changes as ft_robust.yaml (harder data, L2-SP towards the pretrained release). Start from the last.ckpt of
# ft_robust. Every value that differs from lm.yaml is marked DEVIATION. Everything else is lm.yaml.
pretrained: redimnet:M-vb2+vox2+cnc-ft_mix
max_params: 7000000

crop_sec: [2.015, 6.015]   # DEVIATION: one length per batch, uniform. lm.yaml: 6.015 ([RD] 6 s). Keeping 2 s batches
                           #   so that the large-margin stage does not specialise on long segments only
min_dur: 1.0               # [WS-LM] filter_args.min_num_frames 100
speed_perturb: []          # [RD] turned off ([WS-LM] keeps it in the yaml but train.py disables it when do_lm)
aug_chain: hard            # DEVIATION: [R2-HA] augmentation tree (MUSAN music/noise/babble -> RIR -> low-pass);
                           #   ReDimNet-M's own recipe uses the plain WeSpeaker chain
aug_prob: 0.6              # (not used by the hard chain)
hard_prob: 0.7             # [R2-HA] lm: probability of the whole tree
lowpass_prob: 0.5          # DEVIATION: [R2-HA] 0.25. Raised because ~23 % of the training files have <= 4 kHz
                           #   effective bandwidth (EDA) and narrow-band / cross-band validation trials are the hardest
lowpass_cutoffs: [0.5, 0.6]  # [R2-HA] uses 0.6 (4.8 kHz); 0.5 (4 kHz, telephone band) is in the [R2-HA] comments
lowpass_width: 0.08        # [R2-HA] LowPassAug width
hard_noise_prob: 0.8       # [R2-HA] OneOf(music, noise, babble) p 0.8
hard_reverb_prob: 0.2      # [R2-HA] Reverb p 0.2
l2sp_anchor: redimnet:M-vb2+vox2+cnc-ft_mix   # L2-SP anchor = the pretrained release (Li et al.: w0 = pre-trained weights)
specaug: checkpoint        # the checkpoint's model_config: do_spec_aug true, freq [0,10], time [0,20]

loss: aam                  # [RD] AAM softmax; [WS-RD] project_type arc_margin, easy_margin false
s: 32.0                    # [WS-RD] / [WS-LM] scale 32
m: 0.5                     # [RD] constant 0.5; [WS-LM] initial_margin = final_margin = 0.5
m_start: 0.5
m_increase_start_epoch: 1
m_fix_start_epoch: 1
head_init: centroid        # DEVIATION: new speakers -> centroid rows (weight imprinting, Qi et al. CVPR 2018);
                           # with --initial_model <FT last.ckpt> the FT rows are copied.

optimizer: sgd             # [WS-LM] SGD momentum 0.9 nesterov
momentum: 0.9
nesterov: true
weight_decay: 0.0001       # [WS-LM]
head_wd_mult: 1.0          # WeSpeaker: one parameter group
scheduler: exp             # [WS-LM] ExponentialDecrease
lr: 0.0001                 # [WS-LM] initial_lr
final_lr: 0.000025         # [WS-LM] final_lr
lr_scale_ratio: -1         # WeSpeaker train.py: scale_ratio = world_size * batch_size / 64
warmup_epochs: 1           # [WS-LM] warm_up_epoch 1, warm_from_zero true
warm_from_zero: true
max_epoch: 5               # [WS-LM] num_epochs 5
batch_size: 128            # [WS-LM] batch_size 64 per GPU x 2 GPUs
accum_steps: 1
amp: true                  # DEVIATION: [WS-LM] enable_amp False; fp16 is needed for speed on T4 (head stays fp32)
grad_clip: 0               # WeSpeaker executor: no clipping
freeze_epochs: 0
l2sp: 0.01                 # DEVIATION: L2-SP weight alpha. Li et al. choose alpha by cross-validation in
                           #   {1e-3, 1e-2, 1e-1, 1} (Fig. 1); not tuned here: middle of that grid. With L2-SP the
                           #   encoder gets no weight decay (the penalty replaces it, as in the paper)
layer_decay: 1.0
bn_mode: train

eval_dur: 8.0              # [R2] eval_dur 8.0: first 8 s of every file, wrap-padded (Vox1TestEvalDatasetSimple), rank 0
eval_amp: true             # [R2] eval under autocast(enable_amp); one input shape
eval_batch: 16             # [R2] validation batch = batch_size // 4 (64 // 4)
cohort_size: 1000
select_score: center       # WeSpeaker local/score.sh cal_mean True
test_step: 1
eval_init: true
seed: 42                   # [WS-LM]
n_cpu: 4
keep_last: 2
max_hours: 11.0
